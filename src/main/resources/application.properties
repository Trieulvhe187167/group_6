#————————————————————————
# Database Configuration (SQL Server)
#————————————————————————
spring.datasource.url=jdbc:sqlserver://LAPTOP-Q4D6UCM6\\MSSQLSERVER01:1433;databaseName=HotelManagement;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#————————————————————————
# JPA / Hibernate
#————————————————————————
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect

#————————————————————————
# Server
#————————————————————————
server.port=8080
#————————————————————————
# Spring MVC - JSP View Resolver
#————————————————————————
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp
#————————————————————————
# Logging
#————————————————————————
logging.level.org.springframework=INFO
logging.level.com.example.hms=DEBUG

# Disable Spring Boot default error page
server.error.whitelabel.enabled=false